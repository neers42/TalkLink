services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD:?MYSQL_BACKUP_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./config/mysql/talklink.cnf:/etc/mysql/conf.d/talklink.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talklink-net

  flyway:
    image: flyway/flyway:13.6.0
    container_name: flyway
    depends_on:
      mysql:
        condition: service_healthy
    command: -url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${MYSQL_DATABASE}?permitMysqlScheme=true -user=root -password=${MYSQL_ROOT_PASSWORD} -connectRetries=60 -baselineOnMigrate=true migrate
    volumes:
      - ./mysql/migrations:/flyway/sql
    networks:
      - talklink-net

  chat-redis:
    image: redis:8.8
    container_name: chat-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talklink-net

  auth-redis:
    image: redis:8.8
    container_name: auth-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talklink-net

  chat-service:
    build:
      context: .
      dockerfile: ChatService/Dockerfile
      args:
        BUILD_TYPE: Debug
    container_name: chat-service

    #先にmysqlのコンテナを上げる
    depends_on:
      mysql:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
    ports:
      - "50000:50000"       #TCPのリッスン用のポート
      - "50001:50001/udp"   #UDPポート(マルチキャスト送信用)
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      # ルームシーケンス用。ChatService専用のRedis(auth-serviceとは分離)
      REDIS_HOST: ${CHAT_REDIS_HOST:-chat-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TZ: Asia/Tokyo
      TLS_CERT_PATH: /app/certs/chat-service/server-cert.pem
      TLS_KEY_PATH: /app/certs/chat-service/server-key.pem
      # 複数インスタンスで稼働させる場合はインスタンスごとに一意な値を設定すること
      CHAT_SERVICE_MACHINE_ID: ${CHAT_SERVICE_MACHINE_ID:-1}
      # セッションの検証/削除はauth-serviceのgRPC API経由で行う(Redis直接参照はしない)
      AUTH_SERVICE_GRPC_ADDRESS: auth-service:50010

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    networks:
      - talklink-net
  
  auth-service:
    build:
      context: .
      dockerfile: AuthenticationService/Dockerfile
      args:
        BUILD_TYPE: Debug
    container_name: auth-service
     #先にauth-redisのコンテナを上げる
    depends_on:
      auth-redis:
        condition: service_healthy
    ports:
      - "50002:50002"       #TCPのリッスン用のポート
      - "50003:50003/udp"   #UDPポート(マルチキャスト送信用)
    environment:
      # セッション用。AuthenticationService専用のRedis(chat-serviceとは分離)
      REDIS_HOST: ${AUTH_REDIS_HOST:-auth-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_EXP_LEEWAY_SEC: ${JWT_EXP_LEEWAY_SEC:-60}
      TZ: Asia/Tokyo
      TLS_CERT_PATH: /app/certs/auth-service/server-cert.pem
      TLS_KEY_PATH: /app/certs/auth-service/server-key.pem
      # ChatService向けセッション検証/削除gRPC APIのリッスンポート。
      # 内部ネットワーク限定のためホストには公開しない(portsに追加しない)。
      AUTH_GRPC_PORT: 50010
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - talklink-net

volumes:
  db_data:

networks:
  talklink-net: