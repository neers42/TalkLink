services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD:?MYSQL_BACKUP_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./config/mysql/talklink.cnf:/etc/mysql/conf.d/talklink.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talklink-net

  flyway:
    image: flyway/flyway:13.6.0
    container_name: flyway
    depends_on:
      mysql:
        condition: service_healthy
    command: -url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${MYSQL_DATABASE}?permitMysqlScheme=true -user=root -password=${MYSQL_ROOT_PASSWORD} -connectRetries=60 -baselineOnMigrate=true migrate
    volumes:
      - ./mysql/migrations:/flyway/sql
    networks:
      - talklink-net

  redis:
    image: redis:8.8
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talklink-net

  chat-server:
    build:
      context: .
      dockerfile: ChatServer/Dockerfile
      args:
        BUILD_TYPE: Debug
    container_name: chat-server

    #先にmysqlのコンテナを上げる
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "50000:50000"       #TCPのリッスン用のポート
      - "50001:50001/udp"   #UDPポート(マルチキャスト送信用)
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      TZ: Asia/Tokyo
      TLS_CERT_PATH: /app/certs/chat-server/server-cert.pem
      TLS_KEY_PATH: /app/certs/chat-server/server-key.pem
      # 複数インスタンスで稼働させる場合はインスタンスごとに一意な値を設定すること
      CHAT_SERVER_MACHINE_ID: ${CHAT_SERVER_MACHINE_ID:-1}

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    networks:
      - talklink-net
  
  auth-server:
    build:
      context: .
      dockerfile: AuthenticationServer/Dockerfile
      args:
        BUILD_TYPE: Debug
    container_name: auth-server
     #先にmysqlのコンテナを上げる
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "50002:50002"       #TCPのリッスン用のポート
      - "50003:50003/udp"   #UDPポート(マルチキャスト送信用)
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_EXP_LEEWAY_SEC: ${JWT_EXP_LEEWAY_SEC:-60}
      TZ: Asia/Tokyo
      TLS_CERT_PATH: /app/certs/auth-server/server-cert.pem
      TLS_KEY_PATH: /app/certs/auth-server/server-key.pem
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - talklink-net

volumes:
  db_data:

networks:
  talklink-net: