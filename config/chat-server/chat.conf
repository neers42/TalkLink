[ChatSettings]
max_resend_count=3
max_user_num_in_chatroom=100
max_connections=1000
handshake_timeout_sec=5
heartbeat_timeout_sec=30
heartbeat_check_interval_sec=10

[StartupSettings]
socket_timeout_ms=5000
service_init_timeout_ms=10000
total_timeout_ms=30000
enable_overload_protection=true
enable_health_monitoring=true
max_concurrent_connections=1000
health_check_interval_sec=30
high_usage_warning_threshold_percent=90.0

[ThreadPoolSettings]
# 各プールのスレッド数は、ハードウェアのコア数(std::thread::hardware_concurrency())
# に対する比率で決める。同じ比率のまま、本番/開発などコア数が異なる環境でも
# 自動的にバランスの取れたスレッド数になる(各プール最低1スレッドは確保)。
heartbeat_pool_ratio=0.2
realtime_pool_ratio=0.6
background_pool_ratio=0.2

[OverloadProtectionSettings]
# TaskSchedulerの過負荷保護のしきい値
max_active_tasks=100
active_task_hard_limit=150
overload_recovery_ratio=0.7
